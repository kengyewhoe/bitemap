<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BiteMap — Nearby</title>
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Be+Vietnam+Pro:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script src="/js/theme.js"></script>
    <link rel="stylesheet" href="/css/app.css" />
  </head>
  <body class="bg-map-background h-screen overflow-hidden font-body-md relative">
    <img class="absolute inset-0 w-full h-full object-cover opacity-70" alt="" src="https://images.unsplash.com/photo-1596422846543-75c6fc197f07?w=1400&q=80" />
    <div class="absolute inset-0 bg-map-background/40"></div>
    <div class="absolute top-0 left-0 right-0 p-margin-mobile z-40">
      <div class="bg-map-surface/90 backdrop-blur-md border border-map-outline rounded-full flex items-center p-2">
        <span class="material-symbols-outlined text-map-on-surface ml-2">search</span>
        <input id="q" class="bg-transparent border-none focus:ring-0 text-map-on-surface w-full placeholder:text-sheet-on-surface-muted mx-2" placeholder="Search Kuala Lumpur…" />
      </div>
    </div>
    <div class="absolute bottom-[80px] left-0 right-0 z-40 h-[58vh] bg-sheet-surface rounded-t-[24px] border border-sheet-outline flex flex-col overflow-hidden">
      <div class="w-full h-8 flex justify-center items-center"><div class="w-12 h-1.5 bg-sheet-on-surface-muted/30 rounded-full"></div></div>
      <div class="px-sheet-padding pb-3">
        <h2 class="font-headline-sheet text-headline-sheet">Nearby picks</h2>
        <p class="text-sheet-on-surface-muted text-sm">Last 48 hours · within 5 km</p>
      </div>
      <div id="chips" class="flex gap-2 overflow-x-auto px-sheet-padding pb-3 hide-scrollbar"></div>
      <div id="list" class="flex-1 overflow-y-auto px-sheet-padding pb-4 space-y-2 hide-scrollbar"></div>
    </div>
    <div id="app-nav"></div>
    <script type="module">
      import { places } from "./js/mock.js";
      import { mountNav } from "./js/nav.js";
      import { getSession, setSession } from "./js/session.js";
      mountNav("saved");
      const saved = new Set(getSession()?.saved || []);
      let filter = "all";
      const chips = [
        ["all", "All"],
        ["halal", "Halal"],
        ["non", "Non-Halal"],
      ];
      function render() {
        document.getElementById("chips").innerHTML = chips
          .map(
            ([id, label]) =>
              `<button data-f="${id}" class="flex-shrink-0 px-4 py-1.5 rounded-full text-sm font-semibold border ${filter === id ? "bg-primary text-white border-primary" : "bg-sheet-surface text-sheet-on-surface-muted border-sheet-outline"}">${label}</button>`
          )
          .join("");
        document.querySelectorAll("#chips [data-f]").forEach((b) => {
          b.onclick = () => {
            filter = b.dataset.f;
            render();
          };
        });
        const term = document.getElementById("q").value.toLowerCase();
        const rows = places.filter((p) => {
          if (filter === "halal" && !p.halal) return false;
          if (filter === "non" && p.halal) return false;
          return !term || p.name.toLowerCase().includes(term) || p.area.toLowerCase().includes(term);
        });
        document.getElementById("list").innerHTML = rows
          .map(
            (p) => `<a href="./place.html?id=${p.id}" class="flex gap-4 p-2 -mx-2 rounded-xl hover:bg-sheet-surface-low">
              <img src="${p.thumb}" alt="" class="w-16 h-16 rounded-2xl object-cover border border-sheet-outline" />
              <div class="flex-1 min-w-0">
                <div class="flex justify-between gap-2">
                  <h3 class="font-title-md text-title-md text-tertiary-dark truncate">${p.name}</h3>
                  <button type="button" data-save="${p.id}" class="p-1.5 rounded-full border border-sheet-outline text-sheet-on-surface-muted"><span class="material-symbols-outlined text-[18px]" style="font-variation-settings:'FILL' ${saved.has(p.id) ? 1 : 0}">bookmark</span></button>
                </div>
                <div class="flex items-center gap-2 mt-1">
                  <span class="text-[10px] font-bold uppercase ${p.halal ? "text-secondary bg-secondary-container" : "text-error bg-error-container"} px-1.5 py-0.5 rounded">${p.halal ? "Halal" : "Non-halal"}</span>
                  <span class="text-[10px] text-sheet-on-surface-muted">${p.mentionedBy.handle}</span>
                </div>
                <p class="text-sm text-sheet-on-surface-muted mt-1">${p.stars} · ${p.category} · ${p.km} km</p>
              </div>
            </a>`
          )
          .join("");
        document.querySelectorAll("[data-save]").forEach((btn) => {
          btn.onclick = (e) => {
            e.preventDefault();
            e.stopPropagation();
            const id = btn.dataset.save;
            if (saved.has(id)) saved.delete(id);
            else saved.add(id);
            setSession({ saved: [...saved] });
            render();
          };
        });
      }
      document.getElementById("q").oninput = render;
      render();
    </script>
  </body>
</html>
