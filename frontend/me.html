<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BiteMap — Me</title>
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Be+Vietnam+Pro:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script src="/js/theme.js"></script>
    <link rel="stylesheet" href="/css/app.css" />
  </head>
  <body class="bg-sheet-background text-sheet-on-surface font-body-md min-h-screen pb-28">
    <header class="px-margin-mobile py-4 flex justify-between items-center">
      <span class="font-display-map text-2xl text-primary-container">BiteMap</span>
    </header>
    <main class="px-margin-mobile pt-4" id="main"></main>
    <div id="app-nav"></div>
    <script type="module">
      import { currentUser } from "./js/mock.js";
      import { mountNav } from "./js/nav.js";
      import { getSession, clearSession } from "./js/session.js";
      mountNav("me");
      const session = getSession();
      const votes = Object.keys(session?.votes || {}).length;
      const saved = (session?.saved || []).length;
      document.getElementById("main").innerHTML = `
        <section class="flex flex-col items-center mb-10">
          <img src="${currentUser.avatar}" alt="" class="w-24 h-24 rounded-full object-cover border-4 border-sheet-surface shadow-sm" />
          <h2 class="font-headline-sheet text-headline-sheet mt-4">${currentUser.name}</h2>
          <p class="text-sheet-on-surface-muted">${session?.email || currentUser.email}</p>
          <p class="mt-3 text-sm text-sheet-on-surface-muted">${votes} ratings · ${saved} saved</p>
        </section>
        <section class="bg-sheet-surface rounded-2xl border border-sheet-outline mb-6">
          <h3 class="font-label-caps text-label-caps text-sheet-on-surface-muted px-4 pt-4 uppercase">Account</h3>
          <div class="p-4 text-sheet-on-surface-muted text-sm">Password and linked accounts are backend-owned. UI only for now.</div>
        </section>
        <button id="out" class="w-full py-4 rounded-2xl bg-sheet-surface border border-error-container text-error font-title-md">Sign out</button>
        <p class="text-center text-xs text-sheet-on-surface-muted mt-4">BiteMap frontend mock · no API yet</p>`;
      document.getElementById("out").onclick = () => {
        clearSession();
        location.href = "./login.html";
      };
    </script>
  </body>
</html>
