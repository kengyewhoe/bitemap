<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BiteMap — Login</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Be+Vietnam+Pro:wght@400;500;600;700&family=DM+Sans:wght@400;500;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script src="/js/theme.js"></script>
    <link rel="stylesheet" href="/css/app.css" />
  </head>
  <body class="bg-map-background min-h-screen w-full flex items-center justify-center relative overflow-hidden font-body-md text-body-md">
    <div class="absolute inset-0 z-0">
      <div class="absolute inset-0 bg-map-background/70 z-10"></div>
      <img class="w-full h-full object-cover opacity-70 scale-105" alt="" src="https://images.unsplash.com/photo-1533050487297-09b450131914?w=1400&q=80" />
    </div>
    <main class="relative z-20 w-full max-w-[420px] px-margin-mobile">
      <div class="bg-sheet-surface rounded-[24px] p-sheet-padding border border-sheet-outline shadow-[0_16px_40px_-8px_rgba(0,0,0,0.3)] flex flex-col items-center text-center">
        <div class="w-16 h-16 rounded-full bg-map-mango flex items-center justify-center mb-6 text-map-background font-display-map text-2xl">B</div>
        <h1 class="font-headline-sheet text-headline-sheet text-sheet-on-surface tracking-tight mb-2">Welcome back to the heat</h1>
        <p class="font-body-md text-body-md text-sheet-on-surface-muted mb-8">Log in to find what’s actually legit.</p>
        <!-- Auth is Google-only (BACKEND.md:22) — no email/OTP/magic-link path. -->
        <button id="google" type="button" class="w-full bg-primary-container text-white font-title-md text-title-md py-4 rounded-[16px] active:scale-[0.98]">Continue with Google</button>
        <p id="err" class="hidden text-error text-sm mt-3"></p>
        <p class="font-body-md text-sheet-on-surface-muted mt-8">One tap — your Google account is your BiteMap account.</p>
      </div>
    </main>
    <script type="module">
      // signIn() fakes the session for now; the real
      // supabase.auth.signInWithOAuth({ provider: "google" }) swap lives in
      // js/api.js (see its TODO) — this screen won't change.
      import { signIn } from "./js/api.js";
      document.getElementById("google").addEventListener("click", async () => {
        try {
          await signIn();
          location.href = "./location.html";
        } catch (e) {
          const err = document.getElementById("err");
          err.textContent = e?.message || "Sign-in failed. Try again.";
          err.classList.remove("hidden");
        }
      });
    </script>
  </body>
</html>
