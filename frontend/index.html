<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>BiteMap</title>
    <script>
      const s = JSON.parse(localStorage.getItem("bitemap.session") || "null");
      if (s?.userId && s?.onboarded) location.replace("./home.html");
      else if (s?.userId) location.replace("./location.html");
      else location.replace("./login.html");
    </script>
  </head>
  <body></body>
</html>
